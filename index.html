    <button style="background-color: white; font-size: larger; font-style: italic; color: darkred;" id="muteBtn" onclick="toggleMute()">click to mute</button>

<!-- BUTTON SCRIPT-->

    <script>
    function toggleMute() {
     const audio = document.getElementById('audio');
     audio.muted = !audio.muted;
     if (!audio.muted) {
      audio.play();
     }
     event.target.textContent = audio.muted ? 'click to unmute' : 'click to mute';
  }

    function enterSite() {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('main').style.display = 'block';
        document.getElementById('audio').play();
    }

    </script>
